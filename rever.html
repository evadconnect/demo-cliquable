<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rêver, EVAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 27C5 13 13 5 27 5c0 14-8 22-22 22z' fill='%235F7F52'/%3E%3C/svg%3E">
</head>
<body data-page="rever">
<a class="skip" href="#main">Aller au contenu</a>
<header id="topbar"></header>
<div class="shell">
  <main id="main" class="stage">
    <div class="page-head">
      <div>
        <p class="kicker">Étape 1 sur 5</p>
        <h1>Rêver</h1>
        <p>Inspire-toi des projets qui poussent déjà autour de toi, puis pose les premiers mots de ton rêve.</p>
      </div>
    </div>

    <div class="split">
      <section class="map-card" aria-label="Projets inspirants">
        <div id="map"></div>
        <p class="map-hint">Clique un projet pour t'en inspirer</p>
        <div class="mini-fiche" id="mini-fiche" hidden></div>
      </section>

      <section class="panel" aria-labelledby="vision-title">
        <h2 id="vision-title">Ma vision</h2>
        <div class="field">
          <label for="v-nom">Nom du projet</label>
          <input id="v-nom" type="text" autocomplete="off" placeholder="Ex. La Friche des Tanneurs">
          <button type="button" class="link-btn" id="use-example" style="align-self:flex-start">Utiliser l'exemple : La Friche des Tanneurs</button>
        </div>
        <div class="field">
          <label for="v-promesse">Promesse <span class="hint">en une phrase, ce que le lieu change pour les gens</span></label>
          <textarea id="v-promesse" rows="2"></textarea>
        </div>
        <div class="field">
          <label for="v-reve">Dans 3 ans, on rêve de voir…</label>
          <textarea id="v-reve" rows="3"></textarea>
        </div>
        <h3 class="mini-title">Projets épinglés</h3>
        <ul class="pins" id="pins"></ul>
        <div class="vision-actions">
          <button type="button" class="btn btn-primary" id="to-explorer" disabled>Passer à Explorer</button>
          <p class="muted small" id="next-hint">Donne un nom à ton projet pour continuer.</p>
        </div>
      </section>
    </div>
  </main>
  <aside id="deva" class="deva" aria-label="Deva, ton assistante"></aside>
</div>
<footer id="footer"></footer>
<script src="assets/data.js"></script>
<script src="assets/scene.js"></script>
<script src="assets/deva.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
